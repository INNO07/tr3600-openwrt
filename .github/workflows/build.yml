name: TR3600 candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tr3600-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout build kit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify and unpack source bundle
        run: |
          echo 'a8a167526750a6144e2eb77ea8af601407aeb8089c86f006191e9043f5538276  TR3600-build-kit.zip' | sha256sum -c -
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, zipfile
          with zipfile.ZipFile('TR3600-build-kit.zip') as z:
              for item in z.infolist():
                  parts = pathlib.PurePosixPath(item.filename).parts
                  assert parts[0] == 'TR3600-build-kit' and '..' not in parts
              z.extractall('.')
          root = pathlib.Path('TR3600-build-kit')
          for name, expected in json.loads((root/'SOURCE-SHA256.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          print('SOURCE_BUNDLE_OK')
          PYCODE
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget xz-utils libelf-dev curl ca-certificates zstd
          # Only remove large, unused SDKs on the disposable GitHub runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Test upgrade guards
        run: |
          set -o pipefail
          mkdir -p TR3600-build-kit/artifacts
          python3 -m unittest discover -s TR3600-build-kit/tests -v 2>&1 | tee TR3600-build-kit/artifacts/test.log
      - name: Build and inspect
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TR3600-build-kit/artifacts
          bash TR3600-build-kit/scripts/build.sh 2>&1 | tee TR3600-build-kit/artifacts/build.log
      - name: Save candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TR3600-candidate-${{ github.run_number }}
          path: TR3600-build-kit/artifacts/
          retention-days: 14
          if-no-files-found: warn
